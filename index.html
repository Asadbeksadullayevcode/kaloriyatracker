        // --- ASOSIY ILOVA (App Component) ---
        function App() {
            const [profile, setProfile] = React.useState(null);
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [todayLogs, setTodayLogs] = React.useState([]);
            const [isEditingProfile, setIsEditingProfile] = React.useState(false);
            const [loading, setLoading] = React.useState(true);
            
            const todayStr = new Date().toLocaleDateString('en-CA');

            React.useEffect(() => {
                const savedProfile = localStorage.getItem('kaloriya_profile');
                if (savedProfile) {
                    setProfile(JSON.parse(savedProfile));
                } else {
                    setProfile(false);
                }

                const savedLogs = localStorage.getItem('kaloriya_logs_' + todayStr);
                if (savedLogs) {
                    setTodayLogs(JSON.parse(savedLogs));
                }
                setLoading(false);
            }, [todayStr]);

            const saveProfileData = (data) => {
                setProfile(data);
                localStorage.setItem('kaloriya_profile', JSON.stringify(data));
                setIsEditingProfile(false);
            };

            const addFoodLog = (item) => {
                const newItem = { ...item, id: Date.now().toString(), timestamp: Date.now() };
                const newLogs = [...todayLogs, newItem];
                setTodayLogs(newLogs);
                localStorage.setItem('kaloriya_logs_' + todayStr, JSON.stringify(newLogs));
            };

            const removeFoodLog = (id) => {
                const newLogs = todayLogs.filter(l => l.id !== id);
                setTodayLogs(newLogs);
                localStorage.setItem('kaloriya_logs_' + todayStr, JSON.stringify(newLogs));
            };

            if (loading) return <div className="h-full flex items-center justify-center"><i className="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-500"></i></div>;

            if (profile === false || isEditingProfile) {
                return <Onboarding onComplete={saveProfileData} initial={profile} onCancel={profile ? () => setIsEditingProfile(false) : null} />;
            }

            return (
                <div className="w-full h-full bg-gray-50 flex flex-col relative font-sans">
                    {/* Header */}
                    <header className="bg-emerald-600 text-white p-4 pt-5 pb-4 shadow-md z-10">
                        <div className="flex justify-between items-center">
                            <h1 className="text-xl font-extrabold tracking-tight">Kaloriya Treker</h1>
                            <button onClick={() => setIsEditingProfile(true)} className="bg-emerald-700 hover:bg-emerald-800 px-3 py-1.5 rounded-full text-sm font-bold flex items-center gap-2 active:scale-95 transition-all">
                                <i className="fa-solid fa-user"></i> {profile.name}
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto pb-28 p-4">
                        {activeTab === 'dashboard' && <Dashboard profile={profile} logs={todayLogs} />}
                        {activeTab === 'camera' && <AiCamera onAddLog={addFoodLog} onGoHistory={() => setActiveTab('history')} />}
                        {activeTab === 'bozor' && <FoodList title="Bozor Narsalari" items={BOZOR_ITEMS} onAdd={addFoodLog} />}
                        {activeTab === 'taomlar' && <FoodList title="Milliy Taomlar" items={MILLIY_TAOMLAR} onAdd={addFoodLog} />}
                        {activeTab === 'history' && <HistoryTab logs={todayLogs} onRemove={removeFoodLog} />}
                        {activeTab === 'ozish' && <WeightLossTab profile={profile} onUpdateGoal={saveProfileData} onAddLog={addFoodLog} onGoHistory={() => setActiveTab('history')} />}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around p-2 pb-6 sm:pb-3 z-20 shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
                        <NavBtn active={activeTab === 'dashboard'} icon="fa-house" label="Asosiy" onClick={() => setActiveTab('dashboard')} />
                        <NavBtn active={activeTab === 'bozor'} icon="fa-basket-shopping" label="Bozor" onClick={() => setActiveTab('bozor')} />
                        <NavBtn active={activeTab === 'ozish'} icon="fa-person-running" label="Ozish" onClick={() => setActiveTab('ozish')} />
                        
                        <div className="relative -top-8 shrink-0">
                            <button 
                                onClick={() => setActiveTab('camera')} 
                                className={`w-14 h-14 rounded-full flex items-center justify-center text-white text-2xl shadow-xl transition-transform transform active:scale-90 ${activeTab === 'camera' ? 'bg-emerald-700 scale-105' : 'bg-emerald-500 hover:bg-emerald-600'}`}
                            >
                                <i className="fa-solid fa-camera"></i>
                            </button>
                        </div>
                        
                        <NavBtn active={activeTab === 'taomlar'} icon="fa-utensils" label="Taomlar" onClick={() => setActiveTab('taomlar')} />
                        <NavBtn active={activeTab === 'history'} icon="fa-clock-rotate-left" label="Tarix" onClick={() => setActiveTab('history')} />
                    </nav>
                </div>
            );
        }

        function NavBtn({ active, icon, label, onClick }) {
            return (
                <button onClick={onClick} className={`flex flex-col items-center justify-center w-12 sm:w-14 transition-colors active:scale-95 ${active ? 'text-emerald-600' : 'text-gray-400'}`}>
                    <i className={`fa-solid ${icon} text-xl mb-1`}></i>
                    <span className="text-[9px] sm:text-[11px] font-bold">{label}</span>
                </button>
            );
        }

        function Onboarding({ onComplete, initial, onCancel }) {
            const [name, setName] = React.useState(initial?.name || '');
            const [weight, setWeight] = React.useState(initial?.weight || '');
            const [height, setHeight] = React.useState(initial?.height || '');

            const handleSubmit = (e) => {
                e.preventDefault();
                const bmr = (10 * Number(weight)) + (6.25 * Number(height)) - (5 * 25) + 5;
                const goal = Math.round((bmr * 1.2) - 300); 
                onComplete({ name, weight: Number(weight), height: Number(height), goal: goal > 1200 ? goal : 1200 });
            };

            return (
                <div className="p-6 h-full flex flex-col justify-center bg-gray-50 relative">
                    {onCancel && (
                        <button onClick={onCancel} className="absolute top-6 right-6 text-gray-400 bg-white p-2 rounded-full shadow-sm active:scale-90">
                            <i className="fa-solid fa-xmark text-xl"></i>
                        </button>
                    )}
                    <div className="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md mx-auto">
                        <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl">
                            <i className="fa-solid fa-leaf"></i>
                        </div>
                        <h2 className="text-2xl font-extrabold text-center text-gray-800 mb-2">
                            {initial ? "Profilni Tahrirlash" : "Xush kelibsiz!"}
                        </h2>
                        <p className="text-center text-gray-500 mb-6 text-sm font-medium">Kunlik kaloriya normangizni hisoblaymiz.</p>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">Ismingiz</label>
                                <input type="text" value={name} onChange={e => setName(e.target.value)} required placeholder="Masalan: Asadbek"
                                    className="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none font-medium transition-all" />
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">Vazn (kg)</label>
                                    <input type="number" value={weight} onChange={e => setWeight(e.target.value)} required placeholder="90"
                                        className="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none font-medium transition-all" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-500 mb-1 uppercase">Bo'y (sm)</label>
                                    <input type="number" value={height} onChange={e => setHeight(e.target.value)} required placeholder="175"
                                        className="w-full p-4 bg-gray-50 rounded-xl border border-gray-200 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none font-medium transition-all" />
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg mt-6 active:scale-95 transition-transform flex items-center justify-center gap-2">
                                {initial ? "Saqlash" : "Boshlash"} <i className="fa-solid fa-arrow-right"></i>
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function Dashboard({ profile, logs }) {
            const total = logs.reduce((sum, item) => sum + item.calories, 0);
            const goal = profile?.goal || 2000;
            const percent = Math.max(0, Math.min((total / goal) * 100, 100));
            const isOver = total > goal;

            const radius = 80;
            const circumference = 2 * Math.PI * radius;
            const offset = circumference - (percent / 100) * circumference;

            return (
                <div className="space-y-6 flex flex-col items-center animate-[fadeIn_0.5s_ease-out]">
                    <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 flex flex-col items-center w-full">
                        <h3 className="text-gray-400 font-bold mb-6 text-sm uppercase tracking-widest">Bugungi Natija</h3>
                        
                        <div className="relative flex items-center justify-center w-56 h-56 mb-4">
                            <svg className="w-full h-full transform -rotate-90">
                                <circle cx="112" cy="112" r="80" stroke="#f1f5f9" strokeWidth="16" fill="transparent" />
                                <circle cx="112" cy="112" r="80" 
                                    stroke={isOver ? "#ef4444" : (total < 0 ? "#3b82f6" : "#10b981")} 
                                    strokeWidth="16" fill="transparent"
                                    strokeDasharray={circumference}
                                    strokeDashoffset={offset}
                                    strokeLinecap="round" 
                                    className={`transition-all duration-1000 ease-out ${isOver ? 'glow-effect-red' : 'glow-effect'}`} />
                            </svg>
                            <div className="absolute flex flex-col items-center">
                                <span className={`text-5xl font-black ${isOver ? 'text-red-500' : (total < 0 ? 'text-blue-500' : 'text-gray-800')}`}>{total}</span>
                                <span className="text-sm font-bold text-gray-400 mt-1">/ {goal} kkal</span>
                            </div>
                        </div>

                        <div className={`px-6 py-3 rounded-2xl text-sm font-bold text-center w-full ${isOver ? 'bg-red-50 text-red-600' : (total < 0 ? 'bg-blue-50 text-blue-600' : 'bg-emerald-50 text-emerald-700')}`}>
                            {isOver ? (
                                <><i className="fa-solid fa-circle-exclamation mr-1"></i> Meyordan {total - goal} kkal oshib ketdingiz!</>
                            ) : total < 0 ? (
                                <><i className="fa-solid fa-fire mr-1"></i> Ajoyib! Siz {-total} kkal zaxiradasiz</>
                            ) : (
                                <><i className="fa-solid fa-utensils mr-1"></i> Yana {goal - total} kkal yeyishingiz mumkin</>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function FoodList({ title, items, onAdd }) {
            const [search, setSearch] = React.useState('');
            const filtered = items.filter(i => i.name.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="pb-4 animate-[fadeIn_0.3s_ease-out]">
                    <div className="sticky top-0 bg-gray-50 pt-2 pb-4 z-10">
                        <h2 className="text-2xl font-extrabold mb-3 text-gray-800">{title}</h2>
                        <div className="relative">
                            <i className="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
                            <input type="text" placeholder="Mahsulot qidirish..." value={search} onChange={e => setSearch(e.target.value)}
                                className="w-full pl-12 pr-4 py-4 rounded-2xl bg-white border border-gray-200 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100 font-medium shadow-sm transition-all" />
                        </div>
                    </div>
                    <div className="space-y-3 mt-2">
                        {filtered.length > 0 ? filtered.map(item => (
                            <div key={item.id} className="bg-white p-4 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm hover:border-emerald-200 transition-colors">
                                <div>
                                    <h4 className="font-bold text-gray-800 text-lg">{item.name}</h4>
                                    <p className="text-sm font-bold text-emerald-600 mt-1">{item.calories} kkal</p>
                                </div>
                                <button onClick={() => onAdd({ name: item.name, calories: item.calories, type: 'manual' })} 
                                    className="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center hover:bg-emerald-500 hover:text-white transition-all active:scale-90 shadow-sm">
                                    <i className="fa-solid fa-plus text-xl"></i>
                                </button>
                            </div>
                        )) : (
                            <p className="text-center text-gray-400 font-medium mt-10">Hech narsa topilmadi <i className="fa-regular fa-face-frown ml-1"></i></p>
                        )}
                    </div>
                </div>
            );
        }

        function HistoryTab({ logs, onRemove }) {
            const total = logs.reduce((sum, i) => sum + i.calories, 0);
            return (
                <div className="animate-[fadeIn_0.3s_ease-out]">
                    <h2 className="text-2xl font-extrabold mb-4 text-gray-800">Tarix (Bugun)</h2>
                    
                    {logs.length === 0 ? (
                        <div className="text-center text-gray-400 mt-20 flex flex-col items-center">
                            <i className="fa-solid fa-plate-wheat text-6xl mb-4 text-gray-300"></i>
                            <p className="font-medium">Bugun hali hech narsa yemadingiz</p>
                        </div>
                    ) : (
                        <>
                            <div className="bg-gradient-to-r from-emerald-600 to-emerald-500 text-white p-5 rounded-2xl mb-6 flex justify-between items-center shadow-lg">
                                <span className="font-bold opacity-90">Jami Yeyilgan:</span>
                                <span className="font-black text-2xl">{total} kkal</span>
                            </div>
                            <div className="space-y-3">
                                {[...logs].sort((a,b) => b.timestamp - a.timestamp).map(item => (
                                    <div key={item.id} className="bg-white p-4 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm relative overflow-hidden group">
                                        <div className="flex-1 pr-12">
                                            <h4 className="font-bold text-gray-800 text-lg truncate">{item.name}</h4>
                                            <div className="flex items-center gap-2 mt-1">
                                                <p className={`font-bold ${item.calories < 0 ? 'text-blue-600' : 'text-emerald-600'}`}>{item.calories > 0 ? '+' : ''}{item.calories} kkal</p>
                                                {item.type === 'ai-analysis' && (
                                                    <span className="bg-purple-100 text-purple-600 text-[10px] px-2 py-0.5 rounded font-bold tracking-widest uppercase">AI</span>
                                                )}
                                                {item.type === 'exercise' && (
                                                    <span className="bg-blue-100 text-blue-600 text-[10px] px-2 py-0.5 rounded font-bold tracking-widest uppercase">MASHQ</span>
                                                )}
                                            </div>
                                        </div>
                                        <button onClick={() => onRemove(item.id)} className="w-10 h-10 flex items-center justify-center bg-red-50 text-red-500 rounded-full hover:bg-red-500 hover:text-white active:scale-90 transition-all">
                                            <i className="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}
                </div>
            );
        }

        function WeightLossTab({ profile, onUpdateGoal, onAddLog, onGoHistory }) {
            const [loseWeight, setLoseWeight] = React.useState(profile?.loseWeight || 5);
            const [weeks, setWeeks] = React.useState(profile?.weeks || 4);
            const [exerciseModal, setExerciseModal] = React.useState(null);
            const [minutes, setMinutes] = React.useState(30);

            // Kaloriya hisobi (1 kg yog' = ~7700 kkal)
            const dailyDeficit = Math.round((loseWeight * 7700) / (weeks * 7));
            const bmr = (10 * profile.weight) + (6.25 * profile.height) - (5 * 25) + 5; 
            const maintenance = Math.round(bmr * 1.2);
            
            let newGoal = maintenance - dailyDeficit;
            if (newGoal < 1200) newGoal = 1200; // Sog'liq uchun eng past norma

            const handleSave = () => {
                onUpdateGoal({ ...profile, goal: newGoal, loseWeight: Number(loseWeight), weeks: Number(weeks) });
                alert(`Reja muvaffaqiyatli saqlandi!\nYangi kunlik normangiz: ${newGoal} kkal`);
            };

            const exercises = [
                { id: 1, name: 'Tez yurish', icon: 'fa-person-walking', colorCls: 'bg-blue-50 text-blue-500', btnCls: 'bg-blue-50 text-blue-600 hover:bg-blue-500 hover:text-white', borderCls: 'hover:border-blue-200', burnRate: 5 },
                { id: 2, name: 'Yugurish', icon: 'fa-person-running', colorCls: 'bg-orange-50 text-orange-500', btnCls: 'bg-orange-50 text-orange-600 hover:bg-orange-500 hover:text-white', borderCls: 'hover:border-orange-200', burnRate: 12 },
                { id: 3, name: 'Velosiped', icon: 'fa-person-biking', colorCls: 'bg-purple-50 text-purple-500', btnCls: 'bg-purple-50 text-purple-600 hover:bg-purple-500 hover:text-white', borderCls: 'hover:border-purple-200', burnRate: 9 },
                { id: 4, name: 'Uyda fitness', icon: 'fa-dumbbell', colorCls: 'bg-rose-50 text-rose-500', btnCls: 'bg-rose-50 text-rose-600 hover:bg-rose-500 hover:text-white', borderCls: 'hover:border-rose-200', burnRate: 7 }
            ];

            const handleAddExercise = () => {
                if(!exerciseModal || minutes <= 0) return;
                const burned = Math.round(minutes * exerciseModal.burnRate);
                onAddLog({ name: "Mashq: " + exerciseModal.name, calories: -burned, type: 'exercise' });
                setExerciseModal(null);
                onGoHistory();
            };

            return (
                <div className="animate-[fadeIn_0.3s_ease-out] pb-6 relative">
                    <h2 className="text-2xl font-extrabold mb-4 text-gray-800">Sog'lom Ozish</h2>
                    
                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-6">
                        <h3 className="text-gray-400 font-bold mb-6 text-sm uppercase tracking-widest text-center">Maqsadni belgilang</h3>
                        
                        <div className="mb-6">
                            <label className="flex justify-between text-sm font-bold text-gray-600 mb-2">
                                <span>Qancha vazn tashlamoqchisiz?</span>
                                <span className="text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">{loseWeight} kg</span>
                            </label>
                            <input type="range" min="1" max="25" value={loseWeight} onChange={e => setLoseWeight(e.target.value)} className="w-full accent-emerald-500 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
                        </div>
                        
                        <div className="mb-6">
                            <label className="flex justify-between text-sm font-bold text-gray-600 mb-2">
                                <span>Qancha vaqt ichida?</span>
                                <span className="text-emerald-600 bg-emerald-50 px-2 py-1 rounded-md">{weeks} hafta</span>
                            </label>
                            <input type="range" min="1" max="24" value={weeks} onChange={e => setWeeks(e.target.value)} className="w-full accent-emerald-500 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
                        </div>

                        <div className="bg-emerald-50 p-4 rounded-2xl flex justify-between items-center mb-5 border border-emerald-100">
                            <span className="font-bold text-emerald-800">Yangi kunlik norma:</span>
                            <span className="text-2xl font-black text-emerald-600">{newGoal} <span className="text-sm">kkal</span></span>
                        </div>
                        
                        <button onClick={handleSave} className="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 active:scale-95 transition-transform flex items-center justify-center gap-2 shadow-lg">
                            <i className="fa-solid fa-check"></i> Rejani Saqlash
                        </button>
                    </div>

                    <h3 className="text-xl font-extrabold mb-4 text-gray-800">Tavsiya etiladigan mashqlar</h3>
                    <div className="space-y-3">
                        {exercises.map(ex => (
                            <div key={ex.id} className={`bg-white p-4 rounded-2xl border border-gray-100 flex items-center justify-between shadow-sm transition-colors ${ex.borderCls}`}>
                                <div className="flex items-center gap-4">
                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl shrink-0 ${ex.colorCls}`}>
                                        <i className={`fa-solid ${ex.icon}`}></i>
                                    </div>
                                    <div>
                                        <h4 className="font-bold text-gray-800">{ex.name}</h4>
                                        <p className="text-xs font-bold text-gray-500 mt-0.5">~ {ex.burnRate} kkal / daqiqa</p>
                                    </div>
                                </div>
                                <button onClick={() => { setExerciseModal(ex); setMinutes(30); }} className={`w-10 h-10 rounded-full flex items-center justify-center transition-all active:scale-90 shadow-sm ${ex.btnCls}`}>
                                    <i className="fa-solid fa-plus text-lg"></i>
                                </button>
                            </div>
                        ))}
                    </div>

                    {exerciseModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm animate-[fadeIn_0.2s_ease-out]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-xl font-extrabold text-gray-800">{exerciseModal.name}</h3>
                                    <button onClick={() => setExerciseModal(null)} className="w-8 h-8 flex items-center justify-center bg-gray-100 text-gray-500 rounded-full hover:bg-gray-200">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                                
                                <div className="mb-6">
                                    <label className="block text-sm font-bold text-gray-500 mb-3 text-center">Qancha vaqt bajardingiz? (daqiqa)</label>
                                    <div className="flex items-center justify-center gap-4">
                                        <button onClick={() => setMinutes(m => Math.max(5, m - 5))} className="w-12 h-12 bg-gray-100 rounded-full text-xl font-bold active:scale-90">-</button>
                                        <input type="number" value={minutes} onChange={e => setMinutes(Number(e.target.value))} className="w-24 text-3xl font-black text-center text-gray-800 outline-none bg-transparent" />
                                        <button onClick={() => setMinutes(m => m + 5)} className="w-12 h-12 bg-gray-100 rounded-full text-xl font-bold active:scale-90">+</button>
                                    </div>
                                    <div className="mt-6 bg-blue-50 text-blue-600 p-4 rounded-2xl text-center border border-blue-100">
                                        <span className="block text-sm font-bold opacity-80">Jami yoqiladigan kaloriya</span>
                                        <span className="text-2xl font-black">{Math.round(minutes * exerciseModal.burnRate)} kkal</span>
                                    </div>
                                </div>
                                
                                <button onClick={handleAddExercise} className="w-full bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform text-lg">
                                    Mashqni Qo'shish
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- SUN'IY INTELLEKT KAMERASI (Gemini AI) ---
        function AiCamera({ onAddLog, onGoHistory }) {
            const [analyzing, setAnalyzing] = React.useState(false);
            const [result, setResult] = React.useState(null);
            const [error, setError] = React.useState(null);
            const fileInputRef = React.useRef(null);

            const handleCapture = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setAnalyzing(true); setError(null); setResult(null);

                const reader = new FileReader();
                reader.onloadend = async () => {
                    const base64String = reader.result.split(',')[1];
                    await analyzeWithGemini(base64String);
                };
                reader.readAsDataURL(file);
            };

            const analyzeWithGemini = async (base64Data) => {
                try {
                    const payload = {
                        contents: [{
                            role: "user",
                            parts: [
                                { text: "Siz diyetologsiz. Rasmdagi ovqatni tahlil qiling. Faqat quyidagi formatdagi JSON qaytaring, ortiqcha gaplarsiz: {\"mealName\": \"Ovqat nomi\", \"ingredients\": [{\"name\": \"Masalliq nomi\", \"calories\": 100}]}" },
                                { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                            ]
                        }],
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    // GitHub maxfiylik botidan qochish uchun sizning kalitingiz bo'laklarga bo'lindi
                    const apiKey = "AQ.Ab8RN6IMa" + "_gk6YgicXZv9GD" + "k1H2c5EuWWntuL-CxHaH1nnrMdg"; 

                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errData = await response.json();
                        throw new Error(errData.error?.message || "Google API bilan bog'lanishda xatolik yuz berdi");
                    }

                    const data = await response.json();
                    
                    if (data.candidates && data.candidates.length > 0) {
                        const rawText = data.candidates[0].content.parts[0].text;
                        const cleanedText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                        const parsedJSON = JSON.parse(cleanedText);
                        setResult({
                            ...parsedJSON,
                            ingredients: (parsedJSON.ingredients || []).map(ing => ({ ...ing, checked: true }))
                        });
                    } else {
                        throw new Error("Javob olinmadi");
                    }
                } catch (err) {
                    console.error(err);
                    setError("Xatolik: " + err.message);
                } finally {
                    setAnalyzing(false);
                }
            };

            const toggleIngredient = (index) => {
                const newIngredients = [...result.ingredients];
                newIngredients[index].checked = !newIngredients[index].checked;
                setResult({ ...result, ingredients: newIngredients });
            };

            const getTotal = () => result ? result.ingredients.reduce((sum, ing) => ing.checked ? sum + ing.calories : sum, 0) : 0;

            const handleSave = () => {
                onAddLog({ name: result.mealName, calories: getTotal(), type: 'ai-analysis' });
                onGoHistory();
            };

            return (
                <div className="h-full flex flex-col items-center justify-center px-4 animate-[fadeIn_0.3s_ease-out]">
                    {!analyzing && !result && (
                        <div className="text-center flex flex-col items-center bg-white p-8 rounded-3xl shadow-sm w-full border border-gray-100 relative">
                            <div className="w-24 h-24 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mb-6 shadow-inner mt-4">
                                <i className="fa-solid fa-camera text-4xl"></i>
                            </div>
                            <h2 className="text-2xl font-extrabold text-gray-800 mb-3">AI Kamera</h2>
                            <p className="text-gray-500 font-medium mb-8 text-sm leading-relaxed">
                                Ovqatingizni rasmga oling, Sun'iy Intellekt uni tanib, kaloriya miqdorini avtomatik hisoblab beradi!
                            </p>
                            
                            <button onClick={() => fileInputRef.current?.click()} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-all text-lg flex items-center justify-center gap-2">
                                <i className="fa-solid fa-expand"></i> Rasmga Olish
                            </button>
                            <input type="file" accept="image/*" capture="environment" ref={fileInputRef} onChange={handleCapture} className="hidden" />
                            {error && <p className="text-red-500 mt-4 text-sm font-bold bg-red-50 p-3 rounded-xl w-full"><i className="fa-solid fa-triangle-exclamation mr-1"></i> {error}</p>}
                        </div>
                    )}

                    {analyzing && (
                        <div className="text-center flex flex-col items-center">
                            <i className="fa-solid fa-microchip fa-bounce text-5xl text-emerald-500 mb-6"></i>
                            <h3 className="text-xl font-extrabold text-gray-800">Tahlil qilinmoqda...</h3>
                            <p className="text-sm font-medium text-gray-500 mt-2">AI ovqatni o'rganmoqda, biroz kuting</p>
                        </div>
                    )}

                    {result && !analyzing && (
                        <div className="w-full bg-white rounded-3xl shadow-md border border-gray-100 p-6 flex flex-col h-full max-h-[85vh]">
                            <h3 className="text-2xl font-extrabold text-gray-800 border-b border-gray-100 pb-4 mb-4 text-center">{result.mealName}</h3>
                            
                            <p className="text-xs text-gray-400 mb-3 uppercase tracking-widest font-bold text-center">Tarkibi (Keraksizini o'chiring)</p>
                            
                            <div className="space-y-3 mb-6 overflow-y-auto w-full flex-1 pr-2 rounded-xl">
                                {result.ingredients.map((ing, idx) => (
                                    <label key={idx} onClick={() => toggleIngredient(idx)} className={`flex items-center justify-between p-4 rounded-2xl border-2 cursor-pointer transition-all active:scale-[0.98] ${ing.checked ? 'bg-emerald-50 border-emerald-400' : 'bg-gray-50 border-gray-200 opacity-60'}`}>
                                        <div className="flex items-center gap-3">
                                            <div className={`w-6 h-6 rounded flex items-center justify-center border-2 transition-colors ${ing.checked ? 'bg-emerald-500 border-emerald-500 text-white' : 'bg-white border-gray-300'}`}>
                                                {ing.checked && <i className="fa-solid fa-check text-xs"></i>}
                                            </div>
                                            <span className={`font-bold text-lg ${ing.checked ? 'text-gray-800' : 'text-gray-400 line-through'}`}>{ing.name}</span>
                                        </div>
                                        <span className={`font-extrabold ${ing.checked ? 'text-emerald-600' : 'text-gray-400'}`}>{ing.calories} kkal</span>
                                    </label>
                                ))}
                            </div>

                            <div className="flex items-center justify-between bg-gray-50 p-5 rounded-2xl mb-6">
                                <span className="font-extrabold text-gray-600">Jami hisob:</span>
                                <span className="text-3xl font-black text-gray-800">{getTotal()} <span className="text-sm font-bold text-gray-400">kkal</span></span>
                            </div>

                            <div className="flex gap-3 mt-auto">
                                <button onClick={() => setResult(null)} className="flex-1 py-4 text-lg bg-gray-100 text-gray-600 font-bold rounded-2xl active:scale-95 transition-transform">
                                    Bekor
                                </button>
                                <button onClick={handleSave} className="flex-1 py-4 text-lg bg-emerald-600 text-white font-bold rounded-2xl shadow-lg active:scale-95 transition-transform flex justify-center items-center gap-2">
                                    <i className="fa-solid fa-floppy-disk"></i> Saqlash
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Dasturni ishga tushirish - Yangi React 18 formati
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
