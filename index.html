<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kaloriya Treker PRO</title>
    
    <!-- React va Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; padding-bottom: 70px; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 10px 0; padding-bottom: env(safe-area-inset-bottom, 10px); z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; font-size: 12px; border: none; background: none; }
        .nav-item.active { color: #10b981; }
        .nav-item i { margin-bottom: 4px; width: 24px; height: 24px; }
        
        .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 250px; }
        .circle-bg { fill: none; stroke: #eee; stroke-width: 3.8; }
        .circle { fill: none; stroke-width: 2.8; stroke-linecap: round; transition: stroke-dasharray 1s ease-out; }
        .circle.normal { stroke: #10b981; }
        .circle.over { stroke: #ef4444; }
        .circle.reserve { stroke: #3b82f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // GitHub xavfsizlik botini chalg'itish uchun API kalit bo'laklarga bo'lindi
        const apiKey = "AQ.Ab8RN6IMa" + "_gk6YgicXZv9GD" + "k1H2c5EuWWntuL-CxHaH1nnrMdg";

        const marketItems = [
            { id: 1, name: 'Olma (1 dona)', calories: 52 },
            { id: 2, name: 'Banan (1 dona)', calories: 89 },
            { id: 3, name: 'Tuxum (qaynatilgan)', calories: 78 },
            { id: 4, name: 'Tuxum (qovurilgan)', calories: 90 },
            { id: 5, name: 'Non (1 burda)', calories: 69 },
            { id: 6, name: 'Sosiska (1 dona)', calories: 150 },
            { id: 7, name: 'Pishloq (50g)', calories: 200 }
        ];

        const nationalAndFastFood = [
            { id: 101, name: 'Palov (1 porsiya)', calories: 800 },
            { id: 102, name: 'Somsa (G\'o\'shtli)', calories: 450 },
            { id: 103, name: 'Manti (1 dona)', calories: 150 },
            { id: 104, name: 'Lag\'mon', calories: 600 },
            { id: 105, name: 'Shashlik (Jaz)', calories: 250 },
            { id: 106, name: 'Qozonkabob', calories: 900 },
            { id: 107, name: 'Sho\'rva', calories: 400 },
            // Fast Food va Ichimliklar
            { id: 201, name: 'Lavash (Mol go\'shti)', calories: 700 },
            { id: 202, name: 'Lavash (Tovuq)', calories: 600 },
            { id: 203, name: 'Lavash pishloqli', calories: 750 },
            { id: 204, name: 'Evos Klab Sendvich', calories: 650 },
            { id: 205, name: 'Gamburger', calories: 500 },
            { id: 206, name: 'Chizburger', calories: 550 },
            { id: 207, name: 'Oqtepa Nonburger', calories: 580 },
            { id: 208, name: 'Hot-dog', calories: 400 },
            { id: 209, name: 'KFC Tovuq (1 dona qanot)', calories: 320 },
            { id: 210, name: 'Kartoshka Fri (Katta)', calories: 450 },
            { id: 211, name: 'Pitsa (1 bo\'lak)', calories: 280 },
            { id: 212, name: 'Coca-Cola (0.5L)', calories: 210 },
            { id: 213, name: 'Pepsi (0.5L)', calories: 210 },
            { id: 214, name: 'Fanta (0.5L)', calories: 220 },
            { id: 215, name: 'Energetik (Flash/RedBull)', calories: 230 },
            { id: 216, name: 'Moxito (0.5L)', calories: 180 }
        ];

        const exercises = [
            { id: 301, name: 'Yugurish', kcalPerMin: 10, icon: '🏃' },
            { id: 302, name: 'Turnik tortilish', kcalPerMin: 8, icon: '💪' },
            { id: 303, name: 'Jimaniya (Otjimaniye)', kcalPerMin: 7, icon: '🏋️' },
            { id: 304, name: 'Velosiped haydash', kcalPerMin: 6, icon: '🚴' },
            { id: 305, name: 'Tez yurish', kcalPerMin: 5, icon: '🚶' },
            { id: 306, name: 'Futbol o\'ynash', kcalPerMin: 12, icon: '⚽' }
        ];

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('home');
            const [history, setHistory] = React.useState(() => {
                const saved = localStorage.getItem('calorieHistory');
                return saved ? JSON.parse(saved) : [];
            });
            const [loading, setLoading] = React.useState(false);
            
            // Ozish rejasi parametrlari
            const [weightPlan, setWeightPlan] = React.useState(() => {
                const saved = localStorage.getItem('weightPlan');
                return saved ? JSON.parse(saved) : { loseWeight: 5, weeks: 4, dailyLimit: 2000 };
            });

            const [exerciseModal, setExerciseModal] = React.useState({ show: false, exercise: null, duration: 15 });

            React.useEffect(() => {
                lucide.createIcons();
            });

            // Umumiy kaloriya (yeyilganlar - mashqlar orqali yoqilganlar)
            const totalCalories = history.reduce((sum, item) => sum + item.calories, 0);

            const addFood = (item) => {
                const newItem = { id: Date.now(), name: item.name, calories: item.calories, type: 'food' };
                const updatedHistory = [newItem, ...history];
                setHistory(updatedHistory);
                localStorage.setItem('calorieHistory', JSON.stringify(updatedHistory));
                alert(`${item.name} qo'shildi! (+${item.calories} kkal)`);
            };

            const addExerciseToHistory = () => {
                const burned = exerciseModal.duration * exerciseModal.exercise.kcalPerMin;
                const newItem = { 
                    id: Date.now(), 
                    name: `Mashq: ${exerciseModal.exercise.name} (${exerciseModal.duration} daq)`, 
                    calories: -burned, // MINUS BILAN QO'SHILADI
                    type: 'exercise' 
                };
                const updatedHistory = [newItem, ...history];
                setHistory(updatedHistory);
                localStorage.setItem('calorieHistory', JSON.stringify(updatedHistory));
                setExerciseModal({ show: false, exercise: null, duration: 15 });
                alert(`Barakalla! ${burned} kkal yondirdingiz!`);
            };

            const deleteItem = (id) => {
                const updatedHistory = history.filter(item => item.id !== id);
                setHistory(updatedHistory);
                localStorage.setItem('calorieHistory', JSON.stringify(updatedHistory));
            };

            // AI KAMERA FUNKSIYASI (FLASH MODELDAN FOYDALANILGAN VA XATOLIKLAR KO'RSATILADI)
            const handleCapture = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setLoading(true);
                    const reader = new FileReader();
                    reader.onloadend = async () => {
                        const base64Image = reader.result.split(',')[1];
                        const mimeType = file.type || "image/jpeg"; // Rasm formatini o'zi aniqlaydi
                        
                        try {
                            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    contents: [{
                                        parts: [
                                            { text: "Bu rasmda qanday ovqat bor va uning taxminiy kaloriyasi qancha? Faqat raqam va qisqa nomini o'zbek tilida yoz." },
                                            { inline_data: { mime_type: mimeType, data: base64Image } }
                                        ]
                                    }]
                                })
                            });

                            if (!response.ok) {
                                const errData = await response.json();
                                throw new Error(errData.error?.message || "Noma'lum Google API xatosi");
                            }

                            const data = await response.json();
                            const resultText = data.candidates[0].content.parts[0].text;
                            
                            const matches = resultText.match(/(\d+)/);
                            const calories = matches ? parseInt(matches[0]) : 250; 
                            
                            const newItem = { 
                                id: Date.now(), 
                                name: "Kamera: " + resultText.substring(0, 20) + "...", 
                                calories: calories,
                                type: 'food'
                            };
                            const updatedHistory = [newItem, ...history];
                            setHistory(updatedHistory);
                            localStorage.setItem('calorieHistory', JSON.stringify(updatedHistory));
                            
                            alert(`Topildi: ${resultText}\nKaloriya: ${calories} kkal qo'shildi!`);
                        } catch (error) {
                            console.error(error);
                            alert(`XATOLIK!\nSababi: ${error.message}\nIltimos, qayta urinib ko'ring.`);
                        } finally {
                            setLoading(false);
                        }
                    };
                    reader.readAsDataURL(file);
                }
            };

            const saveWeightPlan = (kg, weeks) => {
                // Oddiy formula: 1 kg yog' = ~7700 kkal. 
                const dailyDeficit = (kg * 7700) / (weeks * 7);
                const baseCalories = 2500; // O'rtacha norma
                let newLimit = Math.round(baseCalories - dailyDeficit);
                if(newLimit < 1200) newLimit = 1200; // Minimal xavfsiz chegara

                const newPlan = { loseWeight: kg, weeks: weeks, dailyLimit: newLimit };
                setWeightPlan(newPlan);
                localStorage.setItem('weightPlan', JSON.stringify(newPlan));
                alert(`Reja saqlandi! Yangi kunlik limit: ${newLimit} kkal`);
            };

            const percentage = Math.max(0, Math.min(100, (totalCalories / weightPlan.dailyLimit) * 100));
            const isOver = totalCalories > weightPlan.dailyLimit;
            const isReserve = totalCalories < 0; // Agar minusga kirsa
            
            let circleColor = "normal";
            if (isOver) circleColor = "over";
            if (isReserve) circleColor = "reserve";

            return (
                <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg">
                    
                    {/* ASOSIY SAHIFA */}
                    <div className={`tab-content p-5 ${activeTab === 'home' ? 'active' : ''}`}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Xush kelibsiz 👋</h2>
                        </div>
                        
                        <div className="bg-white rounded-3xl p-6 shadow-[0_4px_20px_rgba(0,0,0,0.05)] text-center mb-6 relative">
                            <svg viewBox="0 0 36 36" className="circular-chart">
                                <path className="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path className={`circle ${circleColor}`} strokeDasharray={`${isReserve ? 100 : percentage}, 100`} d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-center mt-3">
                                {isReserve ? (
                                    <div className="text-blue-500 font-bold">
                                        <p className="text-3xl">{Math.abs(totalCalories)}</p>
                                        <p className="text-xs">ZAXIRADASIZ</p>
                                    </div>
                                ) : (
                                    <div>
                                        <span className={`text-4xl font-bold ${isOver ? 'text-red-500' : 'text-gray-800'}`}>
                                            {totalCalories}
                                        </span>
                                        <p className="text-gray-500 text-sm mt-1">/ {weightPlan.dailyLimit} kkal</p>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="bg-emerald-50 rounded-2xl p-5 mb-6 text-emerald-800">
                            <p className="font-semibold flex items-center">
                                <i data-lucide="target" className="w-5 h-5 mr-2"></i> Kunlik maqsadingiz:
                            </p>
                            <p className="mt-2 text-sm">Sizning ozish rejangiz bo'yicha kunlik kaloriya me'yoringiz {weightPlan.dailyLimit} kkal etib belgilangan.</p>
                        </div>
                    </div>

                    {/* BOZOR SAHIFA */}
                    <div className={`tab-content p-5 ${activeTab === 'market' ? 'active' : ''}`}>
                        <h2 className="text-2xl font-bold mb-4">Mahsulotlar</h2>
                        
                        <h3 className="font-bold text-gray-600 mb-2 mt-4">Kundalik Taomlar</h3>
                        <div className="space-y-3 mb-6">
                            {marketItems.map(item => (
                                <div key={item.id} className="flex justify-between items-center bg-gray-50 p-4 rounded-xl">
                                    <div>
                                        <p className="font-semibold">{item.name}</p>
                                        <p className="text-sm text-gray-500">{item.calories} kkal</p>
                                    </div>
                                    <button onClick={() => addFood(item)} className="bg-emerald-100 text-emerald-600 p-2 rounded-full font-bold w-10 h-10 flex items-center justify-center">+</button>
                                </div>
                            ))}
                        </div>

                        <h3 className="font-bold text-gray-600 mb-2">Milliy Taomlar, Fast Food va Ichimliklar</h3>
                        <div className="space-y-3">
                            {nationalAndFastFood.map(item => (
                                <div key={item.id} className="flex justify-between items-center bg-gray-50 p-4 rounded-xl">
                                    <div>
                                        <p className="font-semibold">{item.name}</p>
                                        <p className="text-sm text-gray-500">{item.calories} kkal</p>
                                    </div>
                                    <button onClick={() => addFood(item)} className="bg-emerald-100 text-emerald-600 p-2 rounded-full font-bold w-10 h-10 flex items-center justify-center">+</button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* KAMERA SAHIFA */}
                    <div className={`tab-content p-5 text-center min-h-[70vh] flex flex-col items-center justify-center ${activeTab === 'camera' ? 'active' : ''}`}>
                        <div className="w-24 h-24 bg-emerald-100 rounded-full flex items-center justify-center mb-6 text-emerald-500">
                            <i data-lucide="camera" className="w-10 h-10"></i>
                        </div>
                        <h2 className="text-2xl font-bold mb-2">AI Kamera</h2>
                        <p className="text-gray-500 mb-8 max-w-[250px] mx-auto">Ovqatingizni rasmga oling. Sun'iy intellekt uning kaloriyasini hisoblab beradi!</p>
                        
                        <label className={`bg-emerald-500 text-white font-bold py-4 px-10 rounded-full shadow-lg flex items-center cursor-pointer transition ${loading ? 'opacity-50' : 'active:scale-95'}`}>
                            {loading ? (
                                <span>Kuting, tahlil qilinmoqda...</span>
                            ) : (
                                <>
                                    <i data-lucide="scan" className="w-5 h-5 mr-2"></i> Rasmga olish
                                </>
                            )}
                            <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleCapture} disabled={loading} />
                        </label>
                    </div>

                    {/* TARIX SAHIFA */}
                    <div className={`tab-content p-5 ${activeTab === 'history' ? 'active' : ''}`}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold">Tarix</h2>
                            <span className={`px-3 py-1 rounded-full text-sm font-bold ${isReserve ? 'bg-blue-100 text-blue-700' : 'bg-gray-100'}`}>
                                Jami: {totalCalories} kkal
                            </span>
                        </div>
                        
                        {history.length === 0 ? (
                            <p className="text-center text-gray-500 mt-10">Hali hech narsa qo'shilmadi</p>
                        ) : (
                            <div className="space-y-3">
                                {history.map(item => (
                                    <div key={item.id} className="flex justify-between items-center bg-white border border-gray-100 shadow-sm p-4 rounded-xl">
                                        <div>
                                            <p className="font-semibold">{item.name}</p>
                                            <p className={`text-sm font-bold ${item.calories < 0 ? 'text-blue-500' : 'text-gray-500'}`}>
                                                {item.calories > 0 ? '+' : ''}{item.calories} kkal
                                            </p>
                                        </div>
                                        <button onClick={() => deleteItem(item.id)} className="text-red-400 p-2">
                                            <i data-lucide="trash-2" className="w-5 h-5"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* OZISH VA MASHQLAR SAHIFA */}
                    <div className={`tab-content p-5 ${activeTab === 'weightloss' ? 'active' : ''}`}>
                        <h2 className="text-2xl font-bold mb-4 text-center">Sog'lom Ozish</h2>
                        
                        <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-6">
                            <h3 className="font-bold text-gray-700 mb-4">Maqsadni belgilash</h3>
                            
                            <label className="block text-sm text-gray-500 mb-1">Necha kg ozmoqchisiz?</label>
                            <input type="number" id="kgInput" defaultValue={weightPlan.loseWeight} className="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 mb-4 font-bold" />
                            
                            <label className="block text-sm text-gray-500 mb-1">Necha hafta ichida?</label>
                            <input type="number" id="weeksInput" defaultValue={weightPlan.weeks} className="w-full bg-gray-50 border border-gray-200 rounded-lg p-3 mb-4 font-bold" />
                            
                            <button onClick={() => {
                                const kg = document.getElementById('kgInput').value;
                                const weeks = document.getElementById('weeksInput').value;
                                saveWeightPlan(kg, weeks);
                            }} className="w-full bg-blue-500 text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition">
                                Rejani Saqlash
                            </button>
                        </div>

                        <h3 className="font-bold text-gray-700 mb-3">Jismoniy Mashqlar (Kkal yoqish)</h3>
                        <div className="space-y-3">
                            {exercises.map(ex => (
                                <div key={ex.id} className="flex justify-between items-center bg-blue-50 border border-blue-100 p-4 rounded-xl">
                                    <div className="flex items-center">
                                        <span className="text-2xl mr-3">{ex.icon}</span>
                                        <div>
                                            <p className="font-bold text-blue-900">{ex.name}</p>
                                            <p className="text-sm text-blue-600">~{ex.kcalPerMin} kkal / daqiqa</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setExerciseModal({ show: true, exercise: ex, duration: 15 })} className="bg-blue-500 text-white p-2 rounded-full font-bold w-10 h-10 flex items-center justify-center shadow-md active:scale-95">+</button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* MASHQ QO'SHISH MODAL OYNASI */}
                    {exerciseModal.show && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] px-4">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm text-center">
                                <h3 className="text-xl font-bold mb-2">{exerciseModal.exercise.name}</h3>
                                <p className="text-gray-500 text-sm mb-6">Qancha vaqt shug'ullandingiz?</p>
                                
                                <div className="flex items-center justify-center space-x-6 mb-8">
                                    <button onClick={() => setExerciseModal({...exerciseModal, duration: Math.max(1, exerciseModal.duration - 5)})} className="w-12 h-12 rounded-full bg-gray-100 text-2xl font-bold active:bg-gray-200">-</button>
                                    <span className="text-4xl font-black text-blue-500 w-20">{exerciseModal.duration}</span>
                                    <button onClick={() => setExerciseModal({...exerciseModal, duration: exerciseModal.duration + 5})} className="w-12 h-12 rounded-full bg-gray-100 text-2xl font-bold active:bg-gray-200">+</button>
                                </div>
                                
                                <p className="font-bold text-gray-700 mb-6">Yoqiladigan kaloriya: <span className="text-blue-500">{exerciseModal.duration * exerciseModal.exercise.kcalPerMin} kkal</span></p>

                                <div className="flex space-x-3">
                                    <button onClick={() => setExerciseModal({show: false})} className="flex-1 py-3 font-bold text-gray-500 bg-gray-100 rounded-xl">Bekor qilish</button>
                                    <button onClick={addExerciseToHistory} className="flex-1 py-3 font-bold text-white bg-blue-500 rounded-xl">Qo'shish</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* PASTKI MENYU */}
                    <nav className="bottom-nav">
                        <button className={`nav-item ${activeTab === 'home' ? 'active' : ''}`} onClick={() => setActiveTab('home')}>
                            <i data-lucide="home"></i> Asosiy
                        </button>
                        <button className={`nav-item ${activeTab === 'market' ? 'active' : ''}`} onClick={() => setActiveTab('market')}>
                            <i data-lucide="shopping-bag"></i> Bozor
                        </button>
                        <button className={`nav-item ${activeTab === 'camera' ? 'active' : ''} -mt-5`} onClick={() => setActiveTab('camera')}>
                            <div className="bg-emerald-500 text-white p-3 rounded-full shadow-lg shadow-emerald-200">
                                <i data-lucide="camera" style={{color: 'white', margin: 0}}></i>
                            </div>
                        </button>
                        <button className={`nav-item ${activeTab === 'history' ? 'active' : ''}`} onClick={() => setActiveTab('history')}>
                            <i data-lucide="clock"></i> Tarix
                        </button>
                        <button className={`nav-item ${activeTab === 'weightloss' ? 'active text-blue-500' : ''}`} onClick={() => setActiveTab('weightloss')}>
                            <i data-lucide="person-standing"></i> Ozish
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
